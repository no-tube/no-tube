<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>no-tube</title>
<meta name="description" content="no-tube — API'siz alternatif YouTube" />
<meta name="theme-color" content="#0f0f0f" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0f0f0f;color:#f1f1f1;font-family:Roboto,Arial,sans-serif}
  .card:hover{background:#272727}
  .chip{background:#272727}.chip:hover{background:#3d3d3d}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:8px}
  .line2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #shortsView{height:calc(100vh - 130px);height:calc(100dvh - 130px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
  .slide{height:calc(100vh - 150px);height:calc(100dvh - 150px);scroll-snap-align:center;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur border-b border-white/10">
  <div class="max-w-[1400px] mx-auto flex flex-wrap gap-2 sm:gap-3 items-center px-3 sm:px-4 py-2 sm:py-3">
    <button onclick="goHome()" class="text-lg sm:text-xl font-bold whitespace-nowrap">▶ <span class="text-red-500">no</span>-tube</button>
    <div class="ml-auto flex gap-2 order-2">
      <button onclick="toggleHistory()" class="chip rounded-full px-3 sm:px-4 py-2 text-sm">🕘<span class="hidden sm:inline"> Geçmiş</span></button>
      <button onclick="openShorts()" id="shortsBtn" class="chip rounded-full px-3 sm:px-4 py-2 text-sm">⚡<span class="hidden sm:inline"> Shorts</span></button>
    </div>
    <div class="order-3 basis-full sm:order-none sm:basis-auto sm:flex-1 flex sm:max-w-2xl sm:mx-auto">
      <input id="q" placeholder="Ara..." class="w-full min-w-0 bg-[#121212] border border-white/20 rounded-l-full px-4 sm:px-5 py-2 outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()" class="bg-[#222] border border-l-0 border-white/20 rounded-r-full px-4 sm:px-5 shrink-0">🔍</button>
    </div>
  </div>
</header>

<main class="max-w-[1400px] mx-auto px-4 py-5">
  <!-- HOME -->
  <div id="homeView">
    <div id="recoBar" class="mb-6 hidden">
      <h2 class="text-lg font-bold mb-1">Ana Sayfa</h2>
      <p id="recoNote" class="text-xs text-gray-400 mb-3"></p>
      <div id="recoRow" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </div>
    <div id="exploreWrap" class="hidden">
      <h2 id="exploreTitle" class="text-lg font-bold mb-3">🧭 Keşfet</h2>
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <!-- SHORTS -->
  <div id="shortsView" class="hidden relative">
    <button onclick="goHome()" class="fixed left-4 top-20 z-50 chip rounded-full px-4 py-2 text-sm">← Ana Sayfa</button>
    <div class="fixed right-4 top-1/2 -translate-y-1/2 z-50 flex flex-col gap-2">
      <button onclick="shortsNav(-1)" class="chip rounded-full px-3 py-2">▲</button>
      <button onclick="shortsNav(1)" class="chip rounded-full px-3 py-2">▼</button>
    </div>
    <div id="shortsFeed"></div>
  </div>

  <!-- WATCH -->
  <div id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <div class="aspect-video bg-black rounded-xl overflow-hidden">
        <video id="player" controls class="w-full h-full hidden"></video>
        <iframe id="embed" class="w-full h-full hidden" frameborder="0" allowfullscreen allow="accelerometer; autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>
      <p id="vTitle" class="font-bold text-lg mt-3"></p>
      <div class="flex flex-wrap items-center gap-3 mt-2 text-sm text-gray-300">
        <button id="vAuthor" class="font-semibold hover:text-white" onclick="openChannel(currentAuthorId)"></button>
        <span id="vMeta" class="text-gray-400"></span>
        <span class="flex-1"></span>
        <a id="dlMp4" class="chip rounded-full px-3 py-1.5" href="#">⬇ MP4</a>
        <a id="dlMp3" class="chip rounded-full px-3 py-1.5" href="#">🎵 MP3</a>
      </div>
      <details class="mt-3 bg-[#1f1f1f] rounded-xl p-3 text-sm"><summary class="cursor-pointer font-semibold">Açıklama</summary><p id="vDesc" class="whitespace-pre-wrap text-gray-300 mt-2"></p></details>
      <h3 class="font-bold mt-5 mb-2">💬 Yorumlar</h3>
      <div id="comments" class="space-y-3 text-sm"></div>
    </div>
    <div><h3 class="font-bold mb-2">⏭ Sıradakiler (algoritma sıralı)</h3><div id="related" class="space-y-3"></div></div>
  </div>

  <!-- CHANNEL -->
  <div id="channelView" class="hidden">
    <button onclick="goHome()" class="chip rounded-full px-4 py-1.5 text-sm mb-3">← Geri</button>
    <div id="chHead" class="flex gap-4 items-center"></div>
    <div id="chGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4"></div>
  </div>
</main>

<div id="histPanel" class="hidden fixed right-0 top-0 h-full w-80 bg-[#1a1a1a] border-l border-white/10 p-4 z-50 overflow-y-auto">
  <div class="flex justify-between items-center mb-3"><b>İzleme Geçmişi</b><button onclick="toggleHistory()">✖</button></div>
  <button onclick="clearHistory()" class="text-xs text-red-400 mb-3">Temizle</button>
  <div id="histList" class="space-y-2 text-sm"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }</script>
<script src="api-client.js"></script>
<script src="app.js"></script>
</body>
</html>
